<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&display=swap" rel="stylesheet">
<style>
  html {
    font-size: 15px !important;
  }
  body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-size: 15px !important;
  }
  .track {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    animation: scrollup 20s linear infinite;
  }
  .word {
    font-family: 'Architects Daughter', cursive;
    font-size: 15px !important;
    line-height: 1.4;
    color: white;
    padding: 4px 13px;
    white-space: nowrap;
    display: block;
  }
  @keyframes scrollup {
    from { transform: translateY(0); }
    to   { transform: translateY(-50%); }
  }
</style>
</head>
<body>
<div class="track" id="track"></div>
<script>
const words = [
  "creative direction",
  "virtual reality",
  "sound art",
  "spatial computing",
  "video imaging",
  "new media art",
  "experimental film",
  "carnatic musicology",
  "projection mapping"
];

const track = document.getElementById('track');
[...words, ...words].forEach(w => {
  const el = document.createElement('div');
  el.className = 'word';
  el.style.cssText = 'font-size:12px !important; font-family:Architects Daughter,cursive; color:white; padding:4px 12px; white-space:nowrap; display:block; line-height:1.4;';
  el.textContent = w;
  track.appendChild(el);
});
</script>
</body>
</html>
